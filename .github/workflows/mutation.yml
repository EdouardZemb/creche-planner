# AQ-13 (doc 27) — mutation testing Stryker COMPLET sur les libs domaine, sur `main`.
# Depuis le 2026-09-30 (P2 du rééquilibrage, docs/exploitation/proposition-ci-mutation-delta.md) :
# QUOTIDIEN au lieu d'hebdomadaire — le run complet coûte 2,6 min au plus (mesuré),
# et la dérive de fond se voit en un jour au lieu de sept. Les PR, elles, sont
# jugées sur leurs lignes modifiées par le job `mutation-delta` de ci.yml ; ce run
# complet couvre ce que le delta ne voit pas (tests affaiblis dans une PR qui
# touche aussi du code). Un score < 80 % (seuil `break` des stryker.config.mjs)
# met ce run en échec — il remonte dans l'issue de situation. Rapports HTML/JSON archivés 90 j (série temporelle,
# même logique que AQ-06).
name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    # Chaque jour 05:00 UTC — avant la journée de travail, hors des heures de pointe.
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          [
            tarification-domain,
            planification-domain,
            foyer-domain,
            referentiel-domain,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stryker (${{ matrix.project }})
        run: pnpm nx run ${{ matrix.project }}:mutation

      - name: Publier le rapport de mutation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.project }}
          path: |
            libs/*/domain/test-output/stryker/mutation.html
            libs/*/domain/test-output/stryker/mutation.json
          retention-days: 90
