name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

# Annule les runs obsolètes sur une même branche/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Bases Postgres éphémères pour les vérifications de contrat Pact (providers
    # svc-foyer, svc-referentiel, svc-planification et svc-tarification).
    services:
      postgres-foyer:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foyer
          POSTGRES_PASSWORD: foyer
          POSTGRES_DB: foyer
        ports:
          - '5434:5432'
        options: >-
          --health-cmd "pg_isready -U foyer -d foyer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres-referentiel:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: referentiel
          POSTGRES_PASSWORD: referentiel
          POSTGRES_DB: referentiel
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U referentiel -d referentiel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres-planification:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planification
          POSTGRES_PASSWORD: planification
          POSTGRES_DB: planification
        ports:
          - '5435:5432'
        options: >-
          --health-cmd "pg_isready -U planification -d planification"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres-tarification:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tarification
          POSTGRES_PASSWORD: tarification
          POSTGRES_DB: tarification
        ports:
          - '5436:5432'
        options: >-
          --health-cmd "pg_isready -U tarification -d tarification"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres-notifications:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: notifications
          POSTGRES_DB: notifications
        ports:
          - '5437:5432'
        options: >-
          --health-cmd "pg_isready -U notifications -d notifications"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Consommées par les vérifications Pact provider (apps/svc-foyer,
      # apps/svc-referentiel, apps/svc-planification, apps/svc-tarification,
      # apps/svc-notifications). `CI` est positionné automatiquement par GitHub
      # Actions → vérifications bloquantes.
      DATABASE_URL: postgres://foyer:foyer@localhost:5434/foyer
      REFERENTIEL_DATABASE_URL: postgres://referentiel:referentiel@localhost:5433/referentiel
      PLANIFICATION_DATABASE_URL: postgres://planification:planification@localhost:5435/planification
      TARIFICATION_DATABASE_URL: postgres://tarification:tarification@localhost:5436/tarification
      NOTIFICATIONS_DATABASE_URL: postgres://notifications:notifications@localhost:5437/notifications
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet requis pour `nx affected` (calcul de la base).
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # AUD-13 (doc 25) — CACHE NX LOCAL. `nx affected` recalculait lint/typecheck/
      # test/build À FROID à chaque run. On persiste `.nx/cache` entre exécutions :
      # la clé inclut le SHA (sauvegarde fraîche par run) ; `restore-keys` rattache
      # le cache le plus récent du même OS → réutilisation des artefacts inchangés.
      # Pinné SHA (AUD-02). Posé sur le job `ci` (le plus lourd) ; les autres jobs
      # nx (affected-images, e2e-web) restent à froid (moindre gain, clés en conflit).
      - name: Cache Nx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
            nx-${{ runner.os }}-

      # Positionne NX_BASE / NX_HEAD pour `nx affected` (push et PR).
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Format check
        run: pnpm nx format:check

      - name: Lint · type-check · test · build (affected)
        run: pnpm nx affected -t lint typecheck test build --parallel=3

      # Lot D3 — RATCHET ESLint. Le lint `affected` ci-dessus est vert tant qu'il
      # n'y a pas d'ERREUR ; les 28 règles laissées en `warn` (dette assumée)
      # n'étaient donc comptées par personne, et pouvaient remonter indéfiniment.
      # Ce step lint le dépôt ENTIER et refuse tout dépassement de la baseline
      # versionnée. Volontairement hors `affected` : un total ne se compare que
      # s'il porte sur le même périmètre à chaque run.
      - name: Ratchet ESLint — warnings vs baseline (bloquant si remontée)
        run: node .github/workflows/scripts/lint-warnings.mjs

      # Lot D4 — FRONTIÈRES. Le lint ci-dessus n'applique `enforce-module-boundaries`
      # qu'aux tags ENREGISTRÉS en `depConstraints` : un contexte oublié n'est pas
      # « permissif », il n'est jamais évalué (le lint reste vert quoi qu'il
      # importe). Ce step refuse tout tag hors règle, tout tag fantôme en
      # `onlyDependOnLibsWithTags`, et toute divergence d'un miroir de vocabulaire
      # déclaré (recopies assumées que la frontière `domain` ↛ `contracts` impose).
      - name: Frontières Nx + miroirs de vocabulaire (bloquant)
        run: node scripts/verifier-frontieres.mjs

      # B7 — l'audit dev a compté les mêmes cinq pièges de boucle de dev recopiés
      # dans une dizaine de plans, alors que B1 (`pnpm preflight`) et B2 (arêtes
      # `dependsOn` réelles) les avaient rendus impossibles. Purger la prose une
      # fois ne tient pas : un nouveau plan est écrit en recopiant la section
      # « transverses » du précédent — c'est ainsi qu'ils se sont propagés. Ce step
      # refuse la réapparition d'un piège du registre, en pointant la phrase à
      # écrire à la place (CONTRIBUTING.md § Pièges, source unique).
      - name: Pièges morts recopiés dans les plans et la doc (bloquant)
        run: node scripts/verifier-pieges-doc.mjs

      # Registre d'améliorations (doc 35) — les leçons et les pistes trouvées en
      # cours de lot vivaient en prose dans MEMORY.md : le motif « le défaut est
      # dans le périmètre de l'outil » y a été relevé HUIT fois sans jamais
      # devenir une garde, et les tableaux d'audit AQ-xx/AUD-xx se sont périmés
      # faute de preuve attachée à leur statut. Ce step rend la forme opposable
      # (identifiants contigus, pas de statut sans preuve ni critère de sortie,
      # compteurs de motifs recalculés dans les deux sens, règle « 3ᵉ récurrence
      # = porte », ratchet des portes sans sonde négative) et publie le backlog
      # ouvert dans le résumé du run. `--autotest` rejoue ses propres sondes.
      - name: Registre d'améliorations — forme, preuves et compteurs (bloquant)
        run: |
          node scripts/verifier-registre.mjs --autotest
          node scripts/verifier-registre.mjs

      # Durées de conservation (doc 37 §3) — la v1.0 du registre énonçait huit
      # durées en prose ; confrontées au code au moment de les outiller (lot 2b),
      # DEUX nommaient un point de départ inexistant, et les transcrire en SQL
      # aurait produit deux régressions silencieuses (un montant faux et plausible
      # d'un côté, un réabonnement non consenti de l'autre). Ce step exige qu'une
      # durée déclarée outillée NOMME sa colonne, et que celle-ci existe dans TOUS
      # les schémas déclarant la table — attendu dérivé des `schema.ts`, jamais
      # recopié. `--autotest` rejoue sa sonde négative.
      - name: Durées de conservation — ancres réelles (bloquant)
        run: |
          node scripts/verifier-retentions.mjs --autotest
          node scripts/verifier-retentions.mjs

      # Complétude de l'export de portabilité (doc 37 §6) — un export se périme
      # d'une façon particulière : il ne casse pas. On ajoute une table, on
      # oublie de l'exporter, et le document continue de répondre 200 en ayant
      # l'air complet — pire que vert, rassurant, puisqu'il affirme rendre les
      # données de la personne. Ce step exige que les 46 tables des cinq services
      # soient TOUTES classées (exportée / copie / technique / hors périmètre),
      # qu'une table dite exportée soit réellement lue par le code d'export de
      # son service, et qu'une copie nomme une source elle-même exportée.
      # L'attendu est DÉRIVÉ des `schema.ts`, jamais recopié. `--autotest`
      # rejoue ses 3 sondes négatives.
      - name: Export de portabilité — aucune table hors classement (bloquant)
        run: |
          node scripts/verifier-portabilite.mjs --autotest
          node scripts/verifier-portabilite.mjs

      # Piste d'audit acteur (doc 37 §7, AM-45) — une piste d'audit se périme
      # exactement comme l'export : elle ne casse pas. On ajoute une route de
      # mutation, elle n'écrit rien, et la piste continue de répondre — cohérente,
      # simplement muette sur ce qui vient d'arriver. Sur le seul artefact dont
      # toute la valeur est d'être exhaustif, c'est pire que vert. Ce step exige
      # que les 30 routes de mutation des cinq services soient TOUTES classées
      # (auditée / journal seul / exemptée / hors périmètre / différée), qu'une
      # route dite auditée nomme une action réellement consignée par du code de
      # production ET reçoive son acteur (`@ActeurCourant()` sur son handler — ce
      # qu'un contexte ambiant n'aurait pas permis de constater), et qu'un report
      # nomme une piste ENCORE OUVERTE du registre. L'attendu est DÉRIVÉ des
      # contrôleurs. `--autotest` rejoue ses 5 sondes négatives.
      - name: Piste d'audit acteur — aucune mutation hors classement (bloquant)
        run: |
          node scripts/verifier-piste-audit.mjs --autotest
          node scripts/verifier-piste-audit.mjs

      # Format d'erreur unique de la passerelle (RFC 9457, AM-37) — le format
      # vit dans trois fichiers qui ne peuvent pas s'importer : le contrat et son
      # registre de codes, le document OpenAPI (qui ne peut RIEN importer, étant
      # lu par le générateur de types via le type-stripping de Node) et les
      # services, qui posent leurs codes métier en clair. Un code ajouté dans un
      # service et inconnu du registre serait SILENCIEUSEMENT effacé par le
      # filtre — l'écran retomberait sur un message générique sans que rien ne
      # rougisse. Ce step exige que tout code émis soit au registre, que
      # l'énumération publiée SOIT le registre, et que le type de média des deux
      # côtés coïncide. L'attendu est DÉRIVÉ des sources. `--autotest` rejoue ses
      # 4 sondes négatives.
      - name: Format d'erreur RFC 9457 — aucun code hors registre (bloquant)
        run: |
          node scripts/verifier-problemes.mjs --autotest
          node scripts/verifier-problemes.mjs

      # Configuration d'environnement (AM-44) — depuis le lot 5 des standards,
      # chaque app déclare dans son `config.ts` un `CHAMPS_ENV` qui EST
      # l'inventaire des variables qu'elle lit, et `lireEnv` refuse le démarrage
      # sur une valeur illisible. Cet inventaire n'a de valeur que s'il reste
      # complet : les deux moitiés de la vérité vivent dans des fichiers qui ne
      # peuvent pas se lire (du TypeScript dans un bundle, du YAML de Compose), et
      # les deux dérives possibles sont MUETTES — un compose qui pose une variable
      # que personne ne lit (`INTERSERVICE_AUTHZ_ENFORCE` l'était sur la
      # passerelle, qui signe les assertions et ne les vérifie jamais), et une
      # lecture de `process.env` hors du schéma, qui échappe au refus de démarrage
      # et rouvre la divergence de lecture d'AN-20. Attendu DÉRIVÉ des composes et
      # des `config.ts`. `--autotest` rejoue ses 6 sondes négatives.
      - name: Configuration d'environnement — inventaire complet (bloquant)
        run: |
          node scripts/verifier-environnement.mjs --autotest
          node scripts/verifier-environnement.mjs

      # Durcissement des conteneurs (AM-48, lot 8 des standards) — les trois
      # options du CIS Docker que Docker n'applique pas de lui-même
      # (`no-new-privileges` §5.25, `cap_drop: [ALL]` §5.3, `read_only` §5.12)
      # étaient absentes des QUATRE composes. Elles sont désormais posées sur les
      # 29 services des trois piles, par une ancre YAML partagée — d'où cette
      # porte : oublier `<<: *durcissement` sur un service NEUF ne casse rien, ne
      # se voit pas dans un diff et ne rougirait nulle part, alors qu'un conteneur
      # trop permissif démarre parfaitement. Toute capacité reprise et toute
      # racine inscriptible doivent porter un motif, et une entrée de registre
      # devenue fausse est signalée dans l'autre sens — de même qu'un
      # `privileged: true` ou un `security_opt` qui défait un profil, deux façons
      # de désarmer un conteneur sans toucher aux lignes de durcissement.
      # `--autotest` rejoue ses 8 sondes négatives.
      - name: Durcissement des conteneurs — posture CIS complète (bloquant)
        run: |
          node scripts/verifier-conteneurs.mjs --autotest
          node scripts/verifier-conteneurs.mjs

      # Quarantaine des publications npm (AM-50, lot 8 des standards) — le dépôt
      # attend 3 jours avant de RÉSOUDRE une version fraîchement publiée, fenêtre
      # que visent les compromissions de compte de mainteneur. Ce réglage a deux
      # façons de devenir inerte en silence : au mauvais endroit (dans `.npmrc`,
      # que pnpm ne lit plus pour ses réglages depuis 10.16 — c'est le placement
      # que demandait l'énoncé d'origine, et il est SANS EFFET, mesuré), ou
      # désaccordé du cooldown de Dependabot (le manifeste remonte, la résolution
      # ne suit pas). Ce step exige les deux, avec l'attendu DÉRIVÉ des fichiers.
      # `--autotest` rejoue ses 5 sondes négatives.
      - name: Quarantaine des publications npm — délai actif et accordé (bloquant)
        run: |
          node scripts/verifier-quarantaine.mjs --autotest
          node scripts/verifier-quarantaine.mjs

      # Abonnements JetStream (`AM-53`). Les sept consommateurs durables sont
      # désormais bornés à ce que leur projection traite (`filter_subjects` dérivé
      # de `typesGeres`) : un événement qui ne les concerne pas ne leur est plus
      # livré, donc n'écrit plus son payload en clair dans `dead_letter`. Ce gain
      # crée le risque inverse, et c'est lui que ce step couvre : un type ajouté aux
      # contrats et oublié dans l'inventaire de son contexte ne serait plus livré à
      # PERSONNE — et, contrairement au régime d'avant, sans un rebut pour le dire.
      # L'équivalence `typesGeres` ⟷ `switch` est prouvée ailleurs, en exécutant les
      # projections (`projection.types-geres.spec.ts` des 4 services) ; l'effet réel
      # est jugé par le relevé `dead_letter` de `e2e-stack`. `--autotest` rejoue ses
      # 2 sondes négatives.
      - name: Abonnements JetStream — inventaire des événements complet (bloquant)
        run: |
          node scripts/verifier-abonnements.mjs --autotest
          node scripts/verifier-abonnements.mjs

      # Empêchements d'outillage (doc 34 §6) — la liste « Encore réels » de
      # CONTRIBUTING tenait déjà l'inventaire des frictions d'atelier, mais
      # comme une FATALITÉ : aucune n'avait de remède planifié ni de critère de
      # sortie, et leur nombre ne pouvait que croître — le mode de défaillance
      # que le registre a été créé pour tuer côté produit, intact côté atelier.
      # Ce step exige que chaque entrée de cette liste porte une ligne `EM-xx`
      # (ouverte avec son remède, ou ⛔ avec un renoncement daté), et qu'une
      # ligne close ne reste pas listée comme « encore réelle ». L'attendu est
      # DÉRIVÉ de CONTRIBUTING, jamais recopié. `--autotest` rejoue ses 7 sondes.
      - name: Empêchements d'outillage — pièges hérités mis en file (bloquant)
        run: |
          node scripts/verifier-empechements.mjs --autotest
          node scripts/verifier-empechements.mjs

      # Politique de documentation (doc 35), volet « navigation ». Un lien mort
      # ne se voit qu'en le suivant : renommer un fichier, renommer un titre
      # (l'ancre suit le titre) ou déplacer un document vers `exploitation/`
      # n'échouait nulle part. Ce step vérifie les liens INTERNES et leurs
      # ancres ; les URL externes restent hors périmètre (une porte de CI ne
      # doit pas dépendre d'un site tiers).
      - name: Liens internes de la documentation (bloquant)
        run: |
          node scripts/verifier-liens-doc.mjs --autotest
          node scripts/verifier-liens-doc.mjs

      # Politique de documentation (doc 35), volet « faits dérivés ». Le README
      # a annoncé `0.8.0` quand la coupe était `0.15.0`, et « React 18 » sur un
      # front en 19 — deux dérives en six semaines, toutes deux des RECOPIES
      # manuelles de valeurs qu'un outil écrit déjà. Ce step confronte les faits
      # cités (version coupée, projets Nx, ports de la pile locale, chaîne
      # d'outils) à leur source, au lieu de les relire.
      - name: Faits de la documentation vs leurs sources (bloquant)
        run: |
          node scripts/verifier-faits-doc.mjs --autotest
          node scripts/verifier-faits-doc.mjs

      # Exigence PO du 2026-08-14 : « à chaque PR le README est à jour ». La
      # règle mécanique — « le diff doit toucher README.md » — serait du bruit
      # (une PR Dependabot n'a rien à dire au README) ; celle-ci DÉRIVE la
      # fraîcheur de faits que le dépôt produit lui-même : portes câblées dans
      # ce workflow, ADR de `docs/adr/`, lots livrés du plan en cours,
      # sous-dossiers de `docs/`. Elle a mordu à son premier run sur un README
      # que `pnpm faits` déclarait vert (porte `pnpm acteur` du lot 6 et
      # ADR-0008 du lot 7, l'un et l'autre absents). `--autotest` rejoue ses
      # 7 sondes.
      - name: Fraîcheur du README vs les faits du dépôt (bloquant)
        run: |
          node scripts/verifier-readme.mjs --autotest
          node scripts/verifier-readme.mjs

      # Cible WCAG 2.2 AA (doc 11 §8, AM-49) — une cible d'accessibilité se
      # périme sans rien casser : on l'avance dans la doc, l'outil qui la mesure
      # reste où il était, et son verdict ne change pas d'un caractère. Mesuré au
      # lot 9 : les quatre tags d'origine de l'audit axe sélectionnent 69 règles,
      # et `target-size` (SC 2.5.8) n'en fait pas partie — cette règle est
      # déclarée `enabled: false` dans axe-core, seul le tag `wcag22aa` la met en
      # route. Un audit vert ne disait donc RIEN de WCAG 2.2. Ce step exige que
      # les neuf critères ajoutés par 2.2 soient TOUS statués (identifiants
      # relevés DANS le document, pas cherchés un à un), qu'un critère de la
      # cible porte un verdict étayé, qu'une garde citée existe réellement dans
      # un test, que l'audit demande `wcag22aa` et exerce une largeur sous
      # 768 px, et que le renoncement écrit sur le SC 3.3.8 reste vrai (aucune
      # étape d'authentification propre à l'app). `--autotest` rejoue ses
      # 7 sondes négatives.
      - name: Cible WCAG 2.2 AA — critères statués et outil accordé (bloquant)
        run: |
          node scripts/verifier-wcag.mjs --autotest
          node scripts/verifier-wcag.mjs

      # Politique de documentation (doc 35 §4), volet « cycle de revue »
      # (ISO/IEC/IEEE 26511). Un document qui ne dit ni ce qu'il est, ni depuis
      # quand, ne répond pas à la seule question qu'on lui pose quand il est
      # ancien. Trois formes d'en-tête sont acceptées — relevées dans le dépôt,
      # pas décrétées. La porte ne juge PAS la valeur du statut : décider qu'un
      # « À valider » est validé n'appartient pas à une machine.
      - name: Statut daté des documents (bloquant)
        run: |
          node scripts/verifier-statut-doc.mjs --autotest
          node scripts/verifier-statut-doc.mjs

      # Politique de documentation (doc 35 §5), volet « traçabilité »
      # (ISO/IEC/IEEE 29148, les DEUX sens) : une exigence définie que nul test
      # ne nomme laisse un trou de couverture ; un test qui cite une exigence
      # disparue laisse une preuve qui n'atteste plus rien. Cliquet : les deux
      # familles (CT 18/18, UT 10/10) sont complètes au moment où il est posé.
      - name: Traçabilité exigence vs test (bloquant)
        run: |
          node scripts/verifier-tracabilite-doc.mjs --autotest
          node scripts/verifier-tracabilite-doc.mjs

      # P1-2 (doc 18 §8) — publier les MÉTRIQUES de test, pas seulement le vert/rouge.
      # Les reporters JUnit + couverture lcov/json-summary sont activés en CI par les
      # vitest.config.mts (gardés par `process.env.CI`). On agrège un résumé lisible
      # dans l'onglet de run (GITHUB_STEP_SUMMARY) et on archive les rapports bruts.
      - name: Résumé des métriques de test (GITHUB_STEP_SUMMARY)
        if: always()
        run: node .github/workflows/scripts/test-summary.mjs

      # AQ-06 (doc 27) — rétention LONGUE (90 j, max plan gratuit) : ces artefacts
      # sont la série temporelle des métriques (couverture, durées, flakiness).
      - name: Publier les rapports de test (JUnit + couverture)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/test-output/vitest/junit.xml
            **/test-output/vitest/coverage/lcov.info
            **/test-output/vitest/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 90

      # AQ-06 (doc 27) — GARDE ANTI-RÉGRESSION DE COUVERTURE. La couverture était
      # calculée à chaque run mais jamais COMPARÉE dans le temps : un abaissement
      # silencieux (seuil retiré, exclusion élargie) passerait inaperçu. La baseline
      # est l'artefact `coverage-baseline` publié par le dernier run `main` (rolling :
      # fusion projet par projet au fil des runs affectés). Téléchargement TOLÉRANT :
      # premier run ou artefact expiré (90 j sans push main) → comparaison sautée.
      - name: Télécharger la baseline de couverture (dernier run main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=coverage-baseline&per_page=100" \
            --jq '[.artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not))][0].id // empty')
          if [ -z "$ART_ID" ]; then
            echo "Aucune baseline de couverture disponible (premier run) — comparaison sautée."
          else
            echo "Baseline : artefact ${ART_ID}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/coverage-baseline.zip
            unzip -o /tmp/coverage-baseline.zip -d .coverage-baseline
          fi

      # Échec si la couverture lignes d'un projet mesuré baisse de > 0,5 pt vs
      # baseline ; résumé comparatif dans GITHUB_STEP_SUMMARY. Produit aussi la
      # baseline fusionnée (coverage-baseline/) publiée par le step suivant.
      - name: Comparer la couverture à la baseline (bloquant si baisse > 0,5 pt)
        run: node .github/workflows/scripts/coverage-compare.mjs

      # Publication de la baseline mise à jour : push main UNIQUEMENT (les PR
      # comparent, seul main fait référence). `if: success()` implicite — une
      # régression bloquée ne doit pas devenir la nouvelle référence.
      - name: Publier la baseline de couverture (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-baseline
          path: coverage-baseline/coverage-baseline.json
          retention-days: 90

  # P1-6 (doc 18 §8) — chaîne SÉCURITÉ minimale (SCA). La gateway est HTTP publique :
  # on BLOQUE sur toute vulnérabilité high/critical des dépendances de PRODUCTION
  # (surface d'attaque réelle du runtime). On exécute aussi un audit de l'arbre
  # COMPLET (dev/test inclus) en INFORMATIF non bloquant : les advisories y sont
  # surtout des outils de test (ex. underscore transitif via @pact-foundation/pact),
  # non déployés, qu'on ne veut pas voir rougir `main`. Complété par Dependabot
  # (.github/dependabot.yml) et CodeQL (.github/workflows/codeql.yml).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SCA sur le lock pnpm (v9) via Trivy. L'ancien `pnpm audit` est MORT depuis que
      # npm a retiré l'endpoint `/-/npm/v1/security/audits` (HTTP 410, 2026-07-15 ;
      # pnpm <= 10.34 l'utilise encore, cf. pnpm#11265). Trivy lit `pnpm-lock.yaml`
      # directement (aucune install), scanne sa propre base CVE, et EXCLUT les
      # devDependencies par défaut (lock v9+) → on garde la sémantique « production,
      # BLOQUANT ». Mêmes réglages que les autres portes CVE du repo (severity
      # HIGH,CRITICAL ; `ignore-unfixed` = n'échoue que sur du CORRIGIBLE ; `.trivyignore`
      # racine = faux positifs assumés).
      - name: Audit SCA — dépendances de production (high/critical, BLOQUANT)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Arbre COMPLET (devDependencies incluses via TRIVY_INCLUDE_DEV_DEPS) en INFORMATIF
      # non bloquant : les advisories des outils de dev/test (non déployés) restent
      # visibles dans les logs sans rougir `main`.
      - name: Audit SCA — arbre complet dev inclus (informatif, non bloquant)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

  # AUD-09 (doc 25) — SECRET SCANNING. Le flux manipule des secrets réels
  # (`.env.server`, jetons Cloudflare/GHCR) : ce job BLOQUE si un secret est
  # committé. gitleaks scanne l'historique git (fetch-depth: 0) sur push ET PR.
  #
  # GHAS / Security tab — l'upload de résultats « code scanning » (SARIF) et la
  # Push Protection native exigent GitHub Advanced Security, INDISPONIBLE sur ce
  # dépôt privé en plan gratuit (même limite que CodeQL, cf. codeql.yml). Le
  # garde-fou ici est donc l'EXIT CODE du scan (job rouge = fuite), pas un upload.
  # `GITLEAKS_ENABLE_COMMENTS: false` évite d'exiger `pull-requests: write`,
  # mais l'action a tout de même besoin de `pull-requests: read` pour LISTER les
  # commits de la PR (`GET /pulls/:n/commits`) et borner le scan — sans quoi elle
  # échoue en « Resource not accessible by integration » (403).
  # Sur compte personnel, gitleaks-action ne requiert pas de licence (orgs only).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet requis pour scanner tous les commits.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  # AQ-11 (doc 27) — SAST. CodeQL est en PAUSE (GHAS indisponible sur dépôt privé
  # gratuit, cf. codeql.yml) : depuis, AUCUNE analyse statique de sécurité ne
  # tournait. Semgrep OSS prend le relais sans GHAS : pas d'upload SARIF ni
  # d'onglet Security — le garde-fou est l'EXIT CODE (convention doc 25, comme
  # gitleaks/Trivy). Image épinglée par DIGEST (AUD-02).
  #
  # RÈGLES ÉPINGLÉES, PAS LE REGISTRE — l'esquisse doc 27 (`--config p/typescript
  # --config p/nodejs`) a été ÉCARTÉE après vérification locale : sans login, le
  # registre semgrep.dev ne sert qu'un sous-ensemble réduit (74 règles) qui ne
  # détecte même pas `eval(userInput)` ni l'injection de commande — un SAST sans
  # dents. On consomme donc directement les règles OSS de semgrep/semgrep-rules
  # (dossiers javascript/ + typescript/, ~212 règles), épinglées par SHA comme
  # les actions : déterministe, auditables, et `--metrics=off` possible (aucun
  # appel réseau au registre). Montée de version des règles = bump du `ref`.
  #
  # Deux passes (même motif que le job `security`) : findings ERROR bloquants,
  # toutes sévérités en informatif. Un faux positif se traite ligne à ligne par
  # `// nosemgrep: <rule-id>` JUSTIFIÉ en commentaire, jamais par ignore global.
  sast-semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.165.0@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Règles OSS épinglées par SHA (HEAD develop au 2026-06-12). Sparse : seuls
      # les dossiers de règles utiles. `--exclude .semgrep-rules` ci-dessous évite
      # de scanner les FIXTURES volontairement vulnérables des règles elles-mêmes.
      - name: Récupérer les règles (semgrep/semgrep-rules, épinglées)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: 48a4fdb88d6b96fab3d06383aa36e34086bef6b1
          path: .semgrep-rules
          sparse-checkout: |
            javascript
            typescript

      - name: Semgrep — findings ERROR (bloquant)
        run: >-
          semgrep scan --metrics=off
          --config .semgrep-rules/javascript --config .semgrep-rules/typescript
          --exclude .semgrep-rules
          --severity ERROR --error

      - name: Semgrep — toutes sévérités (informatif, non bloquant)
        if: always()
        run: >-
          semgrep scan --metrics=off
          --config .semgrep-rules/javascript --config .semgrep-rules/typescript
          --exclude .semgrep-rules
          || true

  # Parcours E2E du front (Phase 8) : « planifier un mois → lire le coût ».
  # BFF mocké par interception réseau dans les specs → pas de pile docker requise.
  e2e-web:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        # `@playwright/test` n'est déclaré que dans apps/web (convention deps par
        # projet) ; avec le linker pnpm isolé, son bin vit dans
        # apps/web/node_modules/.bin, PAS à la racine. Un `pnpm exec` lancé depuis
        # la racine échoue donc (« Command playwright not found »). On scope
        # l'install au paquet web, comme le fait le target nx `e2e` (cwd: apps/web).
        run: pnpm --filter @creche-planner/web exec playwright install --with-deps chromium

      - name: E2E web (BFF mocké)
        run: pnpm nx e2e web

      # AQ-06 (doc 27) — flakiness : avec `retries: 1` en CI, un test instable finit
      # VERT. Le reporter JSON (playwright.config.ts) note l'outcome `flaky` ; ce
      # step le fait apparaître dans le summary au lieu de le laisser s'installer.
      - name: Résumé E2E + flakiness (GITHUB_STEP_SUMMARY)
        if: always()
        run: node .github/workflows/scripts/e2e-summary.mjs apps/web/test-output/playwright/results.json "E2E web (BFF mocké)"

      - name: Publier le rapport E2E (JUnit + JSON)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-web-report
          path: apps/web/test-output/playwright/
          if-no-files-found: ignore
          retention-days: 90

  # Phase 15 / DoD-2 — SMOKE STACK RÉELLE. Le CI construisait les images
  # (`build-images`, push:false load:true) sans JAMAIS les démarrer : un crash au
  # boot (ex. dépendance non embarquée par `prune-lockfile`) passait inaperçu. Ce
  # job MONTE toute la pile (`docker compose up -d --build --wait`) et PROUVE
  # qu'elle RÉPOND (santé gateway + appel fonctionnel `/api/v1/couts`). Bloquant.
  #
  # PARTAGE D'IMAGES — On NE dépend PAS de `build-images` : ses images chargées
  # (`load: true`) restent LOCALES à son runner et seraient invisibles ici (autre
  # runner). Ce job (re)construit donc la pile lui-même via `compose up --build`,
  # avec le cache buildx GHA implicite. On dépend de `ci` (lint/test/build verts)
  # et de `pact-can-i-deploy` (garde contrats) avant de monter la pile.
  #
  # TEMPS CI (§8 / P2-7 doc 18) — La pile est lourde (4 Postgres + NATS + OTel + 4
  # services + gateway + web). On NE la monte QUE si un projet DÉPLOYABLE est affecté
  # (service/gateway/web), via la sortie `has_projects` de `affected-images` : un diff
  # purement docs/libs ne déclenche plus la pile. `timeout-minutes` borne un hang.
  # AJOUT (lot 8) : la pile est AUSSI montée quand le diff touche la pile elle-même
  # (`config-changes.outputs.pile` — composes, docker/**, Dockerfile). Sans cela, une
  # PR purement compose — celle qui change la pile — ne la bootait JAMAIS.
  smoke-stack:
    needs: [ci, pact-can-i-deploy, affected-images, config-changes]
    if: needs.affected-images.outputs.has_projects == 'true' || needs.config-changes.outputs.pile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Monte les services APPLICATIFS et attend leurs healthchecks (leurs
      # depends_on tirent l'infra : 4 Postgres, NATS, otel-collector→tempo).
      # On EXCLUT les sidecars d'observabilité (prometheus, grafana, nats-exporter) :
      # `--wait` échoue si UN conteneur sort, or nats-exporter peut sortir (code 2)
      # au démarrage à froid — un défaut d'observabilité ne doit pas faire échouer
      # le smoke. `--build` reflète le code local ; un crash au boot d'un service
      # applicatif fait toujours échouer ce step (c'est le but de DoD-2).
      - name: Démarrage de la pile (docker compose up --build --wait)
        run: >-
          docker compose up -d --build --wait
          web api-gateway svc-referentiel svc-foyer svc-planification svc-tarification
          svc-notifications

      # SMOKE 1 — santé gateway. La gateway a un préfixe global `api`
      # (app.config.ts) → la santé est exposée en /api/health ; /health renvoie 404
      # (et curl --retry ne réessaie pas un 404). Cf. AUD-01 (doc 25).
      # `--wait` garantit déjà la gateway HEALTHY (healthcheck liveness ajouté à
      # api-gateway dans docker-compose.yml). On ajoute `--retry-all-errors` pour
      # que curl réessaie aussi un « (52) Empty reply » transitoire (que `--retry`
      # seul n'inclut pas), au cas où la readiness se cale juste après le `--wait`.
      # Depuis le lot B3 cette readiness agrège celle des 5 amonts (base +
      # migrations + NATS de chacun) : elle vaut donc désormais garde de chaîne
      # complète — d'où une fenêtre de patience élargie (20 × 3 s ≈ 60 s), le
      # temps que les migrations Drizzle du démarrage à froid s'appliquent.
      - name: Santé gateway
        run: curl --fail --retry 20 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost:3000/api/health

      # SMOKE 2 — appel fonctionnel réel. `/api/v1/couts` exige un `foyer` : on
      # amorce l'état (seed SANS --verify suffit à créer le foyer), puis on lit
      # le `foyerId` écrit dans scripts/.seed-demo-state.json et on interroge les
      # coûts. Prouve que gateway → services → projection répondent bout en bout.
      - name: Amorçage (seed de référence, sans garde des coûts)
        run: node scripts/seed-demo.mjs

      # `--retry-all-errors` (comme le smoke de santé ci-dessus) : le seed écrit dans
      # svc-foyer, et le coût se lit dans le READ MODEL de svc-tarification, alimenté
      # par `FoyerMisAJour.v3` via l'outbox et NATS. Entre les deux il y a une
      # cohérence à retardement, que ce `curl` interrogeait à la milliseconde près.
      # Depuis le lot 1 (`AM-55`), un foyer non encore projeté ne rend plus un montant
      # plausible mais un **422** — et `--retry` seul ne rejoue PAS un 4xx : la course
      # est devenue un rouge franc, observé une fois sur deux. Dix essais espacés de
      # 3 s tolèrent le retard sans rien masquer : un 422 réel échoue toujours, trente
      # secondes plus tard.
      - name: Appel fonctionnel (GET /api/v1/couts)
        run: |
          FOYER=$(node -e "process.stdout.write(require('./scripts/.seed-demo-state.json').foyerId)")
          echo "Foyer amorcé : $FOYER"
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors "http://localhost:3000/api/v1/couts?foyer=$FOYER&mois=2026-03"

      # P2-6 (doc 18 §8 / doc 23) — SMOKE PERF. La pile est déjà montée et amorcée :
      # on mesure la latence de l'agrégation annuelle (route la plus coûteuse, 12 mois)
      # et on BLOQUE sur une régression multi-secondes (la classe du bug doc 06 §19.7,
      # ~7 s / 502). SLO produit p95 ≈ 0,93 s ; plafond CI tolérant à la variance des
      # runners partagés (PERF_SLO_P95_MS). Résumé publié dans GITHUB_STEP_SUMMARY.
      - name: Smoke performance (GET /api/v1/couts/annuel)
        run: node scripts/perf-smoke.mjs

      # Diagnostic : en cas d'échec, on dump les logs de la pile (services qui
      # crashent au boot, dépendances manquantes…).
      - name: Logs de la pile (si échec)
        if: failure()
        run: docker compose logs --no-color | tail -n 200

      # Teardown systématique (-v : volumes éphémères) pour ne rien laisser debout.
      - name: Arrêt de la pile
        if: always()
        run: docker compose down -v

  # Phase 15 / DoD-3 — E2E STACK RÉELLE. Monte la pile, amorce le seed (avec
  # --verify : garde les montants de coûts) et joue les parcours Playwright
  # contre la VRAIE UI servie par le conteneur web (aucun mock réseau, contrairement
  # à `e2e-web` qu'on conserve pour le feedback rapide). Bloquant avant merge.
  #
  # PARTAGE D'IMAGES / TEMPS CI — mêmes choix que `smoke-stack` : on (re)construit
  # la pile localement (pas de dépendance à `build-images`) et on dépend de `ci` +
  # `pact-can-i-deploy`. Comme `smoke-stack` (P2-7), on ne joue ce job que si un
  # projet déployable est affecté (`affected-images.has_projects`). `pnpm e2e:stack`
  # orchestre up --build --wait + seed --verify + Playwright stack + down -v.
  # Comme `smoke-stack` : un diff qui touche la pile elle-même (composes, docker/**,
  # Dockerfile) la déclenche aussi, via `config-changes.outputs.pile` (lot 8).
  e2e-stack:
    needs: [ci, pact-can-i-deploy, affected-images, config-changes]
    if: needs.affected-images.outputs.has_projects == 'true' || needs.config-changes.outputs.pile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        # `@playwright/test` n'est déclaré que dans apps/web (convention deps par
        # projet) ; avec le linker pnpm isolé, son bin vit dans
        # apps/web/node_modules/.bin, PAS à la racine. Un `pnpm exec` lancé depuis
        # la racine échoue donc (« Command playwright not found »). On scope
        # l'install au paquet web, comme le fait le target nx `e2e` (cwd: apps/web).
        run: pnpm --filter @creche-planner/web exec playwright install --with-deps chromium

      # Orchestration complète : up --build --wait → seed --verify → Playwright
      # stack → down -v (teardown dans le `finally` du script, sauf KEEP_STACK).
      - name: E2E stack réelle (pile + seed + Playwright)
        run: pnpm e2e:stack

      # AQ-06 (doc 27) — même relevé de flakiness que e2e-web, sur le rapport stack
      # (dossier distinct playwright-stack, cf. playwright.stack.config.ts).
      - name: Résumé E2E stack + flakiness (GITHUB_STEP_SUMMARY)
        if: always()
        run: node .github/workflows/scripts/e2e-summary.mjs apps/web/test-output/playwright-stack/results.json "E2E stack réelle"

      - name: Publier le rapport E2E stack (JUnit + JSON)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-stack-report
          path: apps/web/test-output/playwright-stack/
          if-no-files-found: ignore
          retention-days: 90

      # Diagnostic : si `e2e:stack` échoue, sa pile peut déjà être démolie
      # (down -v en finally). On tente quand même un dump — sans échouer le job
      # si la pile n'est plus là (`|| true`).
      - name: Logs de la pile (si échec)
        if: failure()
        run: docker compose logs --no-color | tail -n 200 || true

  # AQ-02 (doc 27) — GARDE ANTI-DÉRIVE DES PACTS COMMITÉS. Les pacts
  # (`pacts/*.json`) sont GÉNÉRÉS par les tests consumer du gateway puis COMMITÉS ;
  # les vérifications provider (job `ci`) et `pact-can-i-deploy` se fondent sur ces
  # fichiers. Rien ne garantissait qu'ils soient À JOUR : une interaction consumer
  # modifiée — ou supprimée : pact-js FUSIONNE dans le fichier existant, il ne
  # retire jamais rien — sans re-commit ferait vérifier les providers contre un
  # contrat périmé. Ce job SUPPRIME les pacts, les régénère depuis zéro (tests du
  # gateway, aucune base requise) et exige un diff vide. La génération est
  # déterministe (vérifié : régénération identique à l'octet près), donc un
  # `git diff --exit-code` suffit, sans normalisation. Bloquant via
  # `pact-can-i-deploy`.
  pact-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # PAS de cache Nx ici (contrairement au job `ci`) : un cache hit sur
      # `api-gateway:test` rejouerait le verdict SANS réécrire les pacts qu'on
      # vient de supprimer → fausse dérive (fichiers manquants). Cette variable
      # fige l'intention même si un cache d'atelier est ajouté plus tard.
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Régénérer les pacts depuis zéro (tests consumer du gateway)
        run: |
          rm -f pacts/*.json
          pnpm nx test api-gateway

      - name: Refuser toute dérive entre pacts régénérés et pacts commités
        run: |
          # `git add -N` (intent-to-add) fait apparaître dans le diff les pacts
          # NOUVEAUX (non suivis) en plus des modifiés/supprimés.
          git add -N pacts/
          if ! git diff --exit-code -- pacts/; then
            echo '::error::Pacts dérivés — les tests consumer du gateway ne reproduisent pas pacts/*.json. Régénérer en local (pnpm nx test api-gateway) et commiter les pacts mis à jour.'
            exit 1
          fi

  # AQ-10 (doc 27) / DEC-03 (doc 09) — GARDE ANTI-DÉRIVE DES TYPES WEB GÉNÉRÉS.
  # `apps/web/src/api/openapi-types.gen.ts` est GÉNÉRÉ par openapi-typescript
  # depuis le contrat `gatewayOpenApiDocument` (contracts-kernel) puis COMMITÉ ;
  # le front type tous ses appels HTTP dessus (façade `types/bff.ts`). Ce job
  # régénère et exige un diff vide : un DTO gateway modifié sans régénération
  # échoue ici. Génération déterministe (openapi-typescript épinglé par le
  # lockfile, sortie sans horodatage, EOL figé LF par .gitattributes) → un
  # `git diff --exit-code` suffit, même motif qu'AQ-02 (pact-drift).
  openapi-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Même précaution que pact-drift : un cache hit Nx rejouerait le verdict
      # sans réécrire le fichier qu'on veut comparer.
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Régénérer les types web depuis le contrat OpenAPI
        run: pnpm nx run web:generate-types

      - name: Refuser toute dérive entre types régénérés et types commités
        run: |
          if ! git diff --exit-code -- apps/web/src/api/openapi-types.gen.ts; then
            echo '::error::Types web dérivés — le contrat OpenAPI gateway a changé sans régénération. Lancer en local `pnpm nx run web:generate-types` et commiter apps/web/src/api/openapi-types.gen.ts.'
            exit 1
          fi

  # DEC-06 — Garde de compatibilité de contrats, surrogate `can-i-deploy` en
  # pacts FICHIERS (cf. docs/adr/0005-registre-de-contrats.md). Le job `ci`
  # prouve déjà que chaque provider honore son pact (specs provider + Postgres) ;
  # ce job ajoute la question « puis-je déployer ? » en vérifiant que la matrice
  # de contrats attendue (api-gateway ↔ services) est complète et cohérente
  # AVANT toute construction d'image. Bloquant. Dépend aussi de `pact-drift`
  # (AQ-02) : inutile de poser la question sur des pacts périmés.
  pact-can-i-deploy:
    needs: [ci, pact-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: can-i-deploy (pacts fichiers)
        run: node .github/workflows/scripts/can-i-deploy.mjs

  # DEC-04/CA2 — Calcule la liste des projets DÉPLOYABLES (services + gateway +
  # web) RÉELLEMENT affectés par le diff, via `nx affected`. Un service non
  # modifié ne ressort pas → il ne sera ni reconstruit ni republié.
  affected-images:
    # `openapi-types-drift` (AQ-10) : ne pas publier d'image web bâtie sur des
    # types périmés vis-à-vis du contrat gateway.
    needs: [ci, pact-can-i-deploy, openapi-types-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.compute.outputs.projects }}
      has_projects: ${{ steps.compute.outputs.has_projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet requis pour `nx affected` (calcul de la base).
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Positionne NX_BASE / NX_HEAD pour `nx affected` (push et PR).
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Calculer les projets déployables affectés
        id: compute
        # Intersection {projets déployables} ∩ {affectés}. JSON compact → matrix.
        run: |
          PROJECTS=$(pnpm nx show projects --affected --projects "apps/svc-*,api-gateway,web" --json)
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          if [ "$PROJECTS" = "[]" ] || [ -z "$PROJECTS" ]; then
            echo "has_projects=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_projects=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Projets déployables affectés : $PROJECTS"

  # AUD-05/06/07/12 (doc 25) — PUBLISHER GHCR (CD réel + chaîne d'appro).
  # Remplace l'ancien `build-images` en push:false (images CONSTRUITES PUIS
  # JETÉES, jamais déployées → la prod reconstruisait les siennes : rupture de
  # parité d'artefact). Désormais UN seul job par service affecté qui :
  #   - sur PR (y compris forks) : BUILD seul (push:false, load:true) — preuve de
  #     constructibilité + image chargée localement pour le scan ; AUCUNE
  #     publication (les forks ne doivent pas pouvoir pousser) [AUD-12].
  #   - sur push:main : BUILD + PUSH GHCR (tags `:main` rolling + `:<sha>`),
  #     attestations provenance + SBOM [AUD-07], puis scan Trivy bloquant
  #     [AUD-06] et signature cosign keyless [AUD-07].
  # Images : ghcr.io/<owner-minuscule>/creche-planner/<projet>. Consommées par
  # docker-compose.server.yml (`docker compose pull && up -d`, plus de --build).
  # NB Security tab : pas d'upload SARIF (code scanning = GHAS indispo sur dépôt
  # privé gratuit, cf. secret-scan/CodeQL) → le garde-fou Trivy est l'exit-code.
  build-images:
    needs: affected-images
    if: needs.affected-images.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    # Build + scan + signature : plus long que l'ancien build seul.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # AUD-05 — push vers GHCR
      id-token: write # AUD-07 — OIDC pour cosign keyless
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.affected-images.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # On ne PUBLIE que sur push:main. Sur PR (y compris forks) : build sans push.
      - name: Faut-il publier ?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # GHCR exige un nom d'image en MINUSCULES ; le propriétaire peut être casé
      # (EdouardZemb) → on abaisse la casse une fois pour le réutiliser partout.
      - name: Référence d'image (minuscules)
        id: ref
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/creche-planner/${{ matrix.project }}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags : `main` (rolling, déployé par la prod) sur la branche par défaut, et
      # `<sha40>` (immuable, rollback précis) toujours. `prefix=` retire le `sha-`.
      - name: Métadonnées (tags + labels OCI)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,prefix=
          labels: |
            org.opencontainers.image.title=creche-planner/${{ matrix.project }}

      # `web` = SPA nginx (Dockerfile dédié, sans build-arg APP).
      - name: Build (+ push sur main) — web
        if: matrix.project == 'web'
        id: build-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # push/provenance/sbom uniquement sur main ; sinon load local (scan).
          # provenance+sbom sont INCOMPATIBLES avec load:true → false sur PR.
          push: ${{ steps.gate.outputs.push }}
          load: ${{ steps.gate.outputs.push != 'true' }}
          provenance: ${{ steps.gate.outputs.push }}
          sbom: ${{ steps.gate.outputs.push }}
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}

      # services NestJS = `Dockerfile` racine générique, ciblé par build-arg APP.
      - name: Build (+ push sur main) — service
        if: matrix.project != 'web'
        id: build-svc
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            APP=${{ matrix.project }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ steps.gate.outputs.push }}
          load: ${{ steps.gate.outputs.push != 'true' }}
          provenance: ${{ steps.gate.outputs.push }}
          sbom: ${{ steps.gate.outputs.push }}
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}

      # AUD-06 — scan CVE bloquant. On scanne la REF `:<sha>` (présente localement
      # via load sur PR, dans GHCR sur main — login déjà fait). `ignore-unfixed`
      # n'échoue que sur des CVE CORRIGIBLES (bruit moindre) ; `.trivyignore` à la
      # racine liste les faux positifs assumés. Pas d'upload SARIF (GHAS indispo).
      - name: Scan CVE (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # AUD-07 — signature keyless cosign (OIDC GitHub) du DIGEST poussé. main seul.
      - name: Installer cosign
        if: steps.gate.outputs.push == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Signer l'image (cosign keyless)
        if: steps.gate.outputs.push == 'true'
        env:
          # digest du build web OU service selon le projet de la matrice.
          DIGEST: ${{ matrix.project == 'web' && steps.build-web.outputs.digest || steps.build-svc.outputs.digest }}
        run: cosign sign --yes "${{ steps.ref.outputs.image }}@${DIGEST}"

      - name: Récapitulatif
        run: |
          echo "Projet ${{ matrix.project }} — publication=${{ steps.gate.outputs.push }}"
          echo "Image : ${{ steps.ref.outputs.image }} (tags main + ${{ github.sha }})"

  # Phase 5 (roadmap CI/CD) — DÉTECTION DE CHANGEMENT DE CONFIG INFRA/OBSERVABILITÉ.
  # Le reste du pipeline raisonne sur le graphe nx (code applicatif) : une PR qui ne
  # touche QUE docker/** ou un compose laisse `affected-images.has_projects=false`,
  # donc smoke-stack / e2e-stack / build-images sont SKIP et la pile Compose n'est
  # JAMAIS bootée. Des bugs de config sont ainsi passés en prod sans être vus en CI
  # (otel-collector :8888 bindé localhost → scrape DOWN ; Infinity allowedHosts
  # manquant). Ce job calcule si la config a changé pour DÉCLENCHER `config-validation`
  # uniquement quand c'est utile (la pile d'observabilité est lourde à monter).
  #
  # POURQUOI un job de détection + `if`, et pas `on.<event>.paths` ? Un filtre `paths`
  # au niveau workflow laisserait un check requis en « pending » éternel sur les PR
  # hors-config (→ blocage). Un job SKIPPÉ par `if:` est, lui, rapporté « skipped »,
  # ce que la protection de branche traite comme RÉUSSI : `config-validation` peut donc
  # être requis sans bloquer les PR qui ne touchent pas la config (cf. observabilite.md,
  # « Validation des configs en CI »).
  config-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      config: ${{ steps.filter.outputs.config }}
      pile: ${{ steps.filter.outputs.pile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Requis par paths-filter pour les événements `push` (diff sur l'historique).
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            config:
              - 'docker/**'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
            # Sous-ensemble qui décrit la PILE elle-même (lot 8 des standards). Il
            # DÉCLENCHE smoke-stack et e2e-stack, que `affected-images` seul
            # laissait skipper sur un diff purement compose — c'est-à-dire
            # exactement sur les PR qui changent la pile. Le durcissement CIS
            # (AM-48) vit dans docker-compose.yml : sans cette entrée, rien
            # n'aurait jamais bootté la pile durcie avant un déploiement.
            # Volontairement plus étroit que `config` : un changement de
            # workflow n'a pas à monter la pile.
            pile:
              - 'docker/**'
              - 'docker-compose*.yml'
              - 'Dockerfile'
              - 'apps/web/Dockerfile'

  # Phase 5 — VALIDATION DES CONFIGS INFRA/OBSERVABILITÉ. Comble l'angle mort décrit
  # sur `config-changes` : on VALIDE statiquement chaque config, puis on PROUVE que la
  # pile d'observabilité boote et que toutes ses cibles de scrape répondent.
  #
  # Aucune dépendance pnpm/nx : ce job n'a besoin que de docker (préinstallé sur le
  # runner). Les images de validation (promtool/amtool/otelcol) sont les MÊMES,
  # épinglées par digest, que celles consommées par docker-compose.yml (AUD-02 / DRY :
  # tout bump de digest dans le compose doit être répercuté dans `env:` ci-dessous).
  #
  # Critère d'acceptation : une PR qui casse alertmanager.yml, un nom/expression de
  # métrique d'alerte, la config otel, ou un compose, échoue ICI.
  config-validation:
    needs: config-changes
    if: needs.config-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Digests = ceux de docker-compose.yml (prometheus v3.12.0, alertmanager v0.32.2,
      # otelcol-contrib v0.153.0). promtool ET amtool vivent dans /bin de leurs images
      # respectives ; otelcol expose le sous-commande `validate` via son entrypoint.
      PROM_IMAGE: prom/prometheus@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
      ALERTMANAGER_IMAGE: prom/alertmanager@sha256:b85533a2eb45865835315810315f6951331b2dbc8c93a6cf9a51e156a006a706
      OTEL_IMAGE: otel/opentelemetry-collector-contrib@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1) Le merge dev/CI + PROD doit produire un Compose valide. L'override serveur
      # exige des variables obligatoires (`${VAR:?}`) et déclare un secret de source
      # `environment` (ALERTMANAGER_SMTP_PASSWORD) qui, non défini, fait ÉCHOUER
      # Compose : on injecte des valeurs FACTICES (jamais de vrais secrets ici) pour
      # valider la STRUCTURE du merge, pas pour démarrer la prod.
      - name: Compose — merge dev/CI + prod valide (config -q)
        env:
          PG_REFERENTIEL_PWD: ci
          PG_FOYER_PWD: ci
          PG_PLANIFICATION_PWD: ci
          PG_TARIFICATION_PWD: ci
          PG_NOTIFICATIONS_PWD: ci
          GRAFANA_ADMIN_PWD: ci
          SERVER_ORIGIN: https://config-validation.invalid
          SERVER_DOMAIN: config-validation.invalid
          CLOUDFLARE_TUNNEL_TOKEN: ci
          ALERTMANAGER_SMTP_PASSWORD: ci
          # Secret de signature des jetons de désabonnement (PR7) : `${VAR:?}` requis
          # par svc-foyer dans l'override prod → valeur factice pour valider la STRUCTURE.
          DESABONNEMENT_TOKEN_SECRET: ci
          # Secret d'assertion d'identité inter-services (fondations lot 3) : `${VAR:?}`
          # requis sur les 6 conteneurs dans l'override prod → valeur factice ici.
          ASSERTION_IDENTITE_SECRET: ci
        run: docker compose -f docker-compose.yml -f docker-compose.server.yml config -q

      # 1bis) Merge dev/CI + STAGING (Phase 8) valide. La pile de staging
      # (docker-compose.staging.yml) ne déclare AUCUN secret ni `${VAR:?}` (elle
      # garde les mots de passe Postgres par défaut du base) → aucune variable
      # factice nécessaire : un `config -q` nu suffit. Garde contre une dérive de la
      # pile staging (image GHCR, ports loopback, nom de projet isolé).
      - name: Compose — merge dev/CI + staging valide (config -q)
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml config -q

      # 2) Prometheus : config (scrape_configs + alerting + rule_files résolus) ET
      # règles d'alerte (PromQL + gabarits d'annotations) parsables. Les montages
      # MIROITENT ceux du compose pour que le `rule_files:` absolu résolve.
      - name: Prometheus — promtool check config + rules
        run: |
          docker run --rm \
            -v "$PWD/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/docker/prometheus:/etc/prometheus/alerts:ro" \
            --entrypoint /bin/promtool "$PROM_IMAGE" \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/docker/prometheus:/etc/prometheus/alerts:ro" \
            --entrypoint /bin/promtool "$PROM_IMAGE" \
            check rules /etc/prometheus/alerts/alerts.yml

      # 3) Alertmanager : structure (route ↔ receivers cohérents, templates, smarthost).
      # `check-config` n'exige PAS le fichier-secret SMTP (lu paresseusement à l'envoi).
      - name: Alertmanager — amtool check-config
        run: |
          docker run --rm \
            -v "$PWD/docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint /bin/amtool "$ALERTMANAGER_IMAGE" \
            check-config /etc/alertmanager/alertmanager.yml

      # 4) Collecteur OTel : receivers/exporters/pipelines cohérents (réf. croisées).
      - name: OTel Collector — otelcol validate
        run: |
          docker run --rm \
            -v "$PWD/docker/otel-collector-config.yaml:/etc/otel/config.yaml:ro" \
            "$OTEL_IMAGE" \
            validate --config=/etc/otel/config.yaml

      # 5) PREUVE DE BOOT — on monte la pile d'observabilité SEULE (sans les services
      # applicatifs ni leurs Postgres). `--wait` échoue si un conteneur ne devient pas
      # sain : les images officielles embarquent toutes un HEALTHCHECK. L'override
      # dev/CI (docker-compose.override.yml, committé) est chargé automatiquement.
      # `blackbox-exporter` est inclus : le job de scrape `blackbox` (Phase 6) le
      # vise (:9115), donc il doit tourner pour que ses cibles soient `up`. NB : ici
      # les services applicatifs ne tournent PAS, donc `probe_success` vaudra 0 ;
      # ce qui importe pour l'assertion ci-dessous, c'est que le SCRAPE du blackbox
      # -exporter réussisse (`up{job="blackbox"}=1` = exporter joignable), pas le
      # résultat de la sonde elle-même.
      - name: Boot pile observabilité (docker compose up --wait)
        # Les postgres-exporter-* (Phase 13c) tirent leurs 5 Postgres via depends_on
        # (sans --no-deps) → le job `postgres` a des cibles UP et `pg_up` = 1 (DB
        # réellement jointe), sinon l'assertion « cibles UP » échouerait. Lot 7 :
        # postgres-exporter-notifications ajouté (sa cible figure dans prometheus.yml).
        run: >-
          docker compose up -d --wait
          prometheus alertmanager grafana otel-collector tempo nats-exporter
          blackbox-exporter loki promtail
          postgres-exporter-referentiel postgres-exporter-foyer
          postgres-exporter-planification postgres-exporter-tarification
          postgres-exporter-notifications

      # 6) Le boot ne suffit pas : la classe de bug visée (otel :8888 bindé localhost)
      # laisse les conteneurs SAINS mais le SCRAPE DOWN. On exige donc que TOUTES les
      # cibles actives de Prometheus soient `up`. Requête via `exec` (indépendante des
      # ports publiés) ; jq est préinstallé sur le runner.
      - name: Cibles Prometheus toutes UP (anti otel:8888 / scrape muet)
        run: |
          set -uo pipefail
          JSON=''
          for i in $(seq 1 18); do
            JSON=$(docker compose exec -T prometheus wget -qO- http://127.0.0.1:9090/api/v1/targets || echo '')
            if [ -n "$JSON" ]; then
              TOTAL=$(echo "$JSON" | jq '.data.activeTargets | length')
              DOWN=$(echo "$JSON" | jq '[.data.activeTargets[] | select(.health != "up")] | length')
              echo "Tentative $i : $((TOTAL - DOWN))/$TOTAL cible(s) UP"
              if [ "$TOTAL" -gt 0 ] && [ "$DOWN" -eq 0 ]; then
                echo "$JSON" | jq -r '.data.activeTargets[] | "  ✔ \(.labels.job) \(.scrapeUrl)"'
                echo "Toutes les cibles Prometheus sont UP."
                exit 0
              fi
            else
              echo "Tentative $i : Prometheus pas encore prêt"
            fi
            sleep 8
          done
          echo "::error::Des cibles Prometheus restent DOWN — config de scrape ou bind d'exposition à revoir."
          echo "$JSON" | jq -r '.data.activeTargets[] | select(.health != "up") | "  ✘ \(.labels.job) \(.scrapeUrl) — \(.lastError)"' || true
          exit 1

      # Diagnostic en cas d'échec d'un des deux derniers steps (boot / cibles).
      - name: Logs de la pile (si échec)
        if: failure()
        run: docker compose logs --no-color | tail -n 200 || true

      # Teardown systématique (-v : volumes éphémères).
      - name: Arrêt de la pile
        if: always()
        run: docker compose down -v

  # AUTO-TEST du script de veille des alertes (`.github/workflows/scripts/veille-alertes.mjs`).
  #
  # POURQUOI un job à part, et pas un step de `config-validation` ? Ce dernier monte la
  # pile d'observabilité (≈15 min) : y cacher une vérification d'une seconde retarderait
  # un signal simple, et mélangerait « validation de config infra » avec « test unitaire
  # d'un script ». Ici le rouge est LISIBLE : un check nommé, qui dit tout de suite ce
  # qui a cassé.
  #
  # CE QUE ÇA GARDE — le script écrit dans `GITHUB_STEP_SUMMARY`, que GitHub REND comme
  # du Markdown : c'est un sink d'injection alimenté par des données de l'écosystème
  # public (noms de paquets npm, résumés d'advisory). CodeQL l'a signalé sur la PR #281
  # (« Network data written to file »). L'assainissement est en place, mais rien
  # n'empêchait quelqu'un de retirer `assainir()` plus tard sans que ça se voie — d'où
  # ce garde-fou EXÉCUTÉ plutôt que documenté.
  #
  # Le jeu d'essai `ALERTES_DRY_RUN=1` est volontairement HOSTILE (saut de ligne, faux
  # titre, lien, `<img onerror>`, pipe de tableau, `html_url` hors github.com) et sort
  # en code 1 (chemin ALERTES, il contient une alerte `high`) : on vérifie donc le CODE
  # DE SORTIE **et** le rendu. Aucun appel réseau, aucune dépendance npm.
  #
  # Gaté sur `config-changes` (qui filtre déjà `.github/workflows/**`) : skippé — donc
  # traité comme réussi par la protection de branche — sur les PR qui n'y touchent pas.
  veille-alertes-autotest:
    name: Auto-test veille alertes
    needs: config-changes
    if: needs.config-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Jeu d'essai hostile — assainissement et code de sortie
        run: |
          # ⚠️ Le shell par défaut d'Actions est `bash -e {0}` : une commande en échec
          # tue le step SUR-LE-CHAMP. Or le script sort VOLONTAIREMENT en 1 (chemin
          # ALERTES) — c'est justement ce qu'on veut mesurer. Sans `set +e`, le step
          # meurt sur l'affectation, avant la moindre assertion, et le rouge ne dit
          # rien. On désactive donc `-e` et on juge le code de sortie nous-mêmes.
          set +e
          set -uo pipefail
          SORTIE=$(ALERTES_DRY_RUN=1 node .github/workflows/scripts/veille-alertes.mjs)
          CODE=$?

          echec() { echo "::error::$1"; echo "--- sortie obtenue ---"; echo "$SORTIE"; exit 1; }

          # 1) Chemin ALERTES : le jeu d'essai porte une alerte `high`, le script DOIT
          #    sortir en 1. Un 0 signifierait que le seuil ne mord plus (faux vert).
          [ "$CODE" -eq 1 ] || echec "code de sortie attendu 1 (chemin ALERTES), obtenu $CODE"

          # 2) La charge d'injection doit ressortir ÉCHAPPÉE.
          echo "$SORTIE" | grep -qF '\[cliquez ici\]' \
            || echec "lien Markdown non échappé — assainir() ne fait plus son travail"
          echo "$SORTIE" | grep -qF '\<img src=x' \
            || echec "balise HTML non échappée — assainir() ne fait plus son travail"

          # 3) Une `html_url` hors github.com ne doit JAMAIS devenir un lien. On cherche
          #    la SIGNATURE d'un lien Markdown vers cet hôte — `](https://…` —, pas la
          #    simple présence de l'hôte : il apparaît légitimement, échappé, en texte.
          if echo "$SORTIE" | grep -qF '](https://exemple-malveillant.test'; then
            echec "URL hors github.com rendue en lien — lienGitHub() ne filtre plus"
          fi
          echo "$SORTIE" | grep -qF '(alerte #7)' \
            || echec "référence sans lien attendue pour une html_url refusée"

          # 4) Tout doit tenir sur UNE ligne : un saut de ligne casserait la structure.
          #    On compte sur un jeton du RÉSUMÉ hostile (« Faux titre ») et non sur le
          #    nom du paquet : depuis AM-75 celui-ci doit être un paquet réellement
          #    embarqué (`pino`), sans quoi le jeu ne bloquerait plus.
          NB=$(echo "$SORTIE" | grep -c 'Faux titre')
          [ "$NB" -eq 1 ] || echec "l'entrée hostile s'étale sur $NB lignes (sauts de ligne non retirés)"

          echo "✅ Assainissement, refus de lien et code de sortie conformes."

      - name: Chemin POINT MORT — un échec d'appel ne vaut jamais « aucune alerte »
        run: |
          # Même raison qu'au step précédent : `bash -e` tuerait le step sur la sortie
          # 1 attendue du chemin POINT MORT.
          set +e
          set -uo pipefail
          SORTIE=$(GITHUB_TOKEN=jeton-invalide node .github/workflows/scripts/veille-alertes.mjs)
          CODE=$?

          if [ "$CODE" -ne 1 ]; then
            echo "::error::un appel d'API en échec doit sortir en 1, obtenu $CODE"
            echo "$SORTIE"; exit 1
          fi
          if ! echo "$SORTIE" | grep -q 'POINT MORT'; then
            echo "::error::un appel en échec doit être signalé POINT MORT, pas silencieusement vert"
            echo "$SORTIE"; exit 1
          fi
          echo "✅ Un appel en échec reste un POINT MORT."

      - name: 403 « Dependabot désactivé » — la marche à suivre doit viser Settings
        run: |
          # Le 403 du 2026-08-05 disait « Dependabot alerts are disabled for this
          # repository » : aucun PAT ne le lève. Un message d'aide qui réclamerait
          # quand même un `ALERTS_TOKEN` enverrait le lecteur fabriquer un jeton
          # inutile pendant que la veille reste aveugle. On verrouille le tri.
          set +e
          set -uo pipefail
          SORTIE=$(ALERTES_DRY_RUN=dependabot-desactive node .github/workflows/scripts/veille-alertes.mjs)
          CODE=$?

          echec() { echo "::error::$1"; echo "--- sortie obtenue ---"; echo "$SORTIE"; exit 1; }

          [ "$CODE" -eq 1 ] || echec "un 403 doit rester un POINT MORT (exit 1), obtenu $CODE"
          echo "$SORTIE" | grep -qF 'Settings → Code security' \
            || echec "l'aide doit renvoyer vers l'activation dans Settings → Code security"
          if echo "$SORTIE" | grep -q 'Poser un secret Actions .ALERTS_TOKEN'; then
            echec "l'aide réclame un PAT alors que la fonctionnalité est désactivée"
          fi
          echo "✅ Un 403 « désactivé » oriente vers l'activation, pas vers un PAT."

      - name: Périmètre bloquant — seul l'embarqué fait rougir (AM-75)
        run: |
          # Le seuil ne doit mordre que sur ce que les images installent vraiment.
          # Attendus DÉRIVÉS du lockfile réel : `pino` est une dépendance de
          # production, `@pact-foundation/pact` un outil de test. Si la clôture
          # cassait (format de lockfile changé), le 1er cas cesserait de bloquer
          # et ce job rougirait — c'est le but.
          set +e
          set -uo pipefail

          echec() { echo "::error::$1"; echo "--- sortie obtenue ---"; echo "$2"; exit 1; }

          MIXTE=$(ALERTES_DRY_RUN=perimetre node .github/workflows/scripts/veille-alertes.mjs)
          CODE_MIXTE=$?
          [ "$CODE_MIXTE" -eq 1 ] || echec "une alerte embarquée doit faire sortir en 1, obtenu $CODE_MIXTE" "$MIXTE"
          echo "$MIXTE" | grep -qF 'embarquée(s) au-dessus du seuil' \
            || echec "l'alerte embarquée n'est pas annoncée comme bloquante" "$MIXTE"
          echo "$MIXTE" | grep -qF 'hors périmètre livré' \
            || echec "l'alerte d'outillage doit rester listée en informatif" "$MIXTE"

          # SONDE NÉGATIVE — l'outillage SEUL doit sortir VERT. C'est elle qui prouve
          # que la distinction change le VERDICT, et pas seulement l'affichage : sans
          # le périmètre, ce cas sortirait en 1 comme avant.
          OUTIL=$(ALERTES_DRY_RUN=perimetre-outillage node .github/workflows/scripts/veille-alertes.mjs)
          CODE_OUTIL=$?
          [ "$CODE_OUTIL" -eq 0 ] || echec "l'outillage seul ne doit pas bloquer, obtenu $CODE_OUTIL" "$OUTIL"
          echo "$OUTIL" | grep -qF 'ne touche le périmètre livré' \
            || echec "le vert doit dire qu'il porte sur le périmètre livré, pas sur « aucune alerte »" "$OUTIL"

          echo "✅ Seul l'embarqué bloque ; l'outillage reste listé."

      - name: Un périmètre inconnu ne rend JAMAIS le seuil permissif
        run: |
          # Symétrique du POINT MORT : si le lockfile devient illisible, on ne
          # dégrade pas vers « rien ne bloque » — tout redevient bloquant.
          set +e
          set -uo pipefail
          SORTIE=$(ALERTES_DRY_RUN=perimetre-outillage \
            ALERTES_LOCKFILE=/inexistant/pnpm-lock.yaml \
            node .github/workflows/scripts/veille-alertes.mjs)
          CODE=$?

          echec() { echo "::error::$1"; echo "--- sortie obtenue ---"; echo "$SORTIE"; exit 1; }

          [ "$CODE" -eq 1 ] || echec "un périmètre inconnu doit tout rendre bloquant, obtenu $CODE"
          echo "$SORTIE" | grep -qF 'Périmètre livré inconnu' \
            || echec "la cécité sur le périmètre doit être NOMMÉE dans le rapport"
          echo "✅ Un périmètre inconnu reste strict."

      - name: Chaque source garde SA pagination et SON jeton
        run: |
          # Le 2026-08-14, un seul réglage pour deux endpoints a produit deux pannes
          # d'un coup, invisibles tant que le 403 tombait avant : `dependabot/alerts`
          # REFUSE `page` (400, pagination au curseur), et lui envoyer le PAT du
          # workflow casse `code-scanning/alerts` quand ce PAT est restreint aux
          # alertes Dependabot. La sonde lit les URL que le script construit VRAIMENT.
          set +e
          set -uo pipefail
          SORTIE=$(ALERTES_DRY_RUN=pagination node .github/workflows/scripts/veille-alertes.mjs)
          CODE=$?

          echec() { echo "::error::$1"; echo "--- sortie obtenue ---"; echo "$SORTIE"; exit 1; }

          [ "$CODE" -eq 0 ] || echec "la sonde de pagination doit sortir en 0, obtenu $CODE"

          DEP=$(echo "$SORTIE" | grep '^Dependabot ')
          CS=$(echo "$SORTIE" | grep '^Code scanning')

          # 1) Dependabot ne doit JAMAIS envoyer `page` — c'est le 400 du 14/08.
          #    ⚠️ Chercher `page=` tout court matche `per_page=100` et rend un faux
          #    positif (constaté sur cette PR même) : on vise le SÉPARATEUR.
          case "$DEP" in
            *"&page="*|*"?page="*) echec "l'URL Dependabot porte un paramètre \`page\` : l'API le refuse (400)" ;;
          esac
          case "$DEP" in
            *"pagination=curseur"*) ;;
            *) echec "Dependabot doit se paginer au curseur" ;;
          esac

          # 2) Le code scanning garde `page` ET le jeton du run : lui donner le PAT
          #    l'a cassé (« Resource not accessible by personal access token »).
          case "$CS" in
            *"page=1"*) ;;
            *) echec "le code scanning doit garder la pagination par page" ;;
          esac
          case "$CS" in
            *"jeton=GITHUB_TOKEN"*) ;;
            *) echec "le code scanning doit être lu avec le jeton du run, pas avec le PAT" ;;
          esac

          echo "✅ Pagination et jeton corrects, source par source."

  # AUTO-TEST de la VEILLE CVE (`image-rescan.mjs`), même patron que ci-dessus.
  #
  # CE QUE ÇA GARDE — le VERDICT DE SOURCE : pour chaque CVE trouvée sur une image en
  # ligne, le rapport dit si le correctif est DÉJÀ dans le dépôt (⇒ redéployer suffit)
  # ou s'il reste à écrire. Sans ce verdict, un même mail « HIGH corrigible » couvrait
  # les deux cas : le 2026-08-13, CVE-2026-69152 (brace-expansion) a été réinstruite de
  # zéro alors qu'elle était corrigée en source depuis 8 jours (overrides pnpm, PR #289).
  #
  # DEUX PROPRIÉTÉS, pas une. (1) La comparaison mord — cas au correctif hors d'atteinte,
  # qui DOIT ressortir « encore présent » ; (2) c'est un RATCHET SUR LES OVERRIDES pnpm :
  # l'attendu du 1er cas est DÉRIVÉ du lockfile réel, donc retirer les overrides
  # brace-expansion fait rougir ce job. Sonde négative jouée à la main avant merge
  # (lockfile forcé à 2.1.3 ⇒ le verdict bascule bien en « encore présent »).
  #
  # RÈGLE CARDINALE VERROUILLÉE ICI — un doute n'est JAMAIS lu comme « déjà corrigé »
  # (symétrique du « un appel en échec n'est jamais aucune alerte » ci-dessus) : un faux
  # « corrigé » ferait repartir la prod vulnérable en croyant l'inverse.
  veille-cve-autotest:
    name: Auto-test veille CVE
    needs: config-changes
    if: needs.config-changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verdict de source — les quatre états, et le ratchet sur les overrides
        env:
          # Version explicite : sans elle le script interroge l'API Deployments. Le
          # mot de passe est factice — `SCAN_DRY_RUN` n'envoie aucun e-mail, mais son
          # absence ferait AVORTER le run avant les assertions (veille muette interdite).
          SCAN_VERSION: 0.0.0-autotest
          SCAN_DRY_RUN: verdicts
          SMTP_PASSWORD: factice
        run: |
          set +e
          set -uo pipefail
          SORTIE=$(node .github/workflows/scripts/image-rescan.mjs)
          CODE=$?

          echec() { echo "::error::$1"; echo "--- sortie obtenue ---"; echo "$SORTIE"; exit 1; }

          # 0) Des findings ne cassent JAMAIS la veille (divergence assumée avec
          #    veille-alertes.yml) : le jeu d'essai en porte 4, la sortie reste 0.
          [ "$CODE" -eq 0 ] || echec "un finding ne doit pas faire échouer la veille, obtenu $CODE"

          # 1) RATCHET — attendu dérivé du lockfile : brace-expansion est corrigée en
          #    source (overrides ^1.1.18/^2.1.4/^5.0.9). Un rouge ici = overrides retirés.
          echo "$SORTIE" | grep -qF 'CVE-2026-69152' \
            || echec "le cas dérivé du lockfile a disparu du jeu d'essai"
          echo "$SORTIE" | grep 'CVE-2026-69152' | grep -qF 'déjà corrigé en source' \
            || echec "brace-expansion n'est plus corrigée en source — les overrides pnpm ont-ils sauté ?"

          # 2) SONDE NÉGATIVE — correctif hors d'atteinte : la comparaison doit mordre.
          #    Sans elle, un verdict qui dirait « corrigé » à tout le monde passerait vert.
          echo "$SORTIE" | grep 'CVE-ESSAI-VULN' | grep -qF 'encore présent en source' \
            || echec "un correctif hors d'atteinte doit ressortir « encore présent »"

          # 3) Paquet OS (absent du lockfile npm) : ne jamais prétendre en juger.
          echo "$SORTIE" | grep 'CVE-ESSAI-OS' | grep -qF 'hors arbre npm' \
            || echec "un paquet OS doit être dit hors arbre npm, pas jugé"

          # 4) Advisory sans correctif publié : doute, donc « à vérifier ».
          echo "$SORTIE" | grep 'CVE-ESSAI-SANSFIX' | grep -qF 'à vérifier' \
            || echec "une CVE sans correctif publié doit rester « à vérifier »"

          echo "✅ Verdicts de source conformes, et le ratchet sur les overrides tient."

      - name: Un lockfile illisible ne vaut JAMAIS « déjà corrigé »
        run: |
          # Symétrique du POINT MORT de la veille alertes : la cécité doit se voir.
          # Si un lockfile introuvable rendait « corrigé », toute CVE serait classée
          # « redéployer suffit » le jour où le fichier bouge de place.
          set +e
          set -uo pipefail
          SORTIE=$(SCAN_VERSION=0.0.0-autotest SCAN_DRY_RUN=verdicts SMTP_PASSWORD=factice \
            SCAN_LOCKFILE=/inexistant/pnpm-lock.yaml \
            node .github/workflows/scripts/image-rescan.mjs)

          echec() { echo "::error::$1"; echo "--- sortie obtenue ---"; echo "$SORTIE"; exit 1; }

          if echo "$SORTIE" | grep -qF 'déjà corrigé en source'; then
            echec "lockfile illisible lu comme « déjà corrigé » — le faux vert est de retour"
          fi
          echo "$SORTIE" | grep -qF 'lockfile source illisible' \
            || echec "la cécité doit être NOMMÉE dans le rapport"
          echo "✅ Un lockfile illisible reste un doute."
