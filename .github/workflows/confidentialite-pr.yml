name: Confidentialité PR

# Le job `ci` juge le titre et la description d'une PR à son ouverture et à
# chaque push. Une description MODIFIÉE ensuite ne relance pas `ci` (trop
# coûteux pour une retouche de texte) : ce workflow minimal la rejuge seul.
# Dépôt public — cf. scripts/verifier-confidentialite.mjs.
#
# Il tourne aussi à l'ouverture et à chaque push, et pas seulement sur
# `edited` : un contrôle qui n'existe que sur les PR éditées ne peut pas être
# rendu REQUIS (une PR jamais éditée l'attendrait pour toujours). Tant qu'il
# n'est pas requis dans la protection de `main`, un rouge après édition se voit
# mais ne bloque pas la fusion. Coût : un checkout et un `node`, quelques
# secondes. Aucune boucle : le job n'écrit rien sur la PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  texte-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Titre et description de la PR (bloquant)
        env:
          CRECHE_MOTIFS_INTERDITS: ${{ secrets.CRECHE_MOTIFS_INTERDITS }}
          PR_TITRE: ${{ github.event.pull_request.title }}
          PR_CORPS: ${{ github.event.pull_request.body }}
        run: node scripts/verifier-confidentialite.mjs --texte-env PR_TITRE PR_CORPS
