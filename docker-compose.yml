# Pile locale complète du walking skeleton (Phase 1).
# `docker compose up --build` lève : infra (Postgres dédié + NATS JetStream),
# observabilité (collecteur OTel → Tempo + Prometheus + Grafana) et les 2 services.
name: creche-planner

# --- Durcissement des conteneurs (AM-48, CIS Docker Benchmark §5) ------------
#
# Posé ICI, dans le fichier de BASE, et non dans l'override de production : les
# trois piles (dev/CI, staging, prod) fusionnent ce fichier, donc la posture est
# la même partout ET elle est réellement éprouvée — `smoke-stack` et `e2e-stack`
# lèvent la pile durcie à chaque PR. Un durcissement qui ne vivrait que dans
# `docker-compose.server.yml` ne serait jamais exercé avant le déploiement.
# Corollaire du merge Compose : `security_opt`, `cap_drop` et `cap_add` sont des
# SÉQUENCES, donc concaténées — un override peut ajouter une capacité, jamais
# retirer celles retirées ici.
#
# Ce que chaque option couvre :
#   - `no-new-privileges:true` (CIS 5.25) : plus aucun gain de privilège par un
#     binaire setuid, y compris pour un processus qui a déjà lâché ses droits ;
#   - `cap_drop: [ALL]` (CIS 5.3) : le noyau ne prête plus les ~14 capacités que
#     Docker accorde par défaut (dont NET_RAW, MKNOD, SETFCAP). Les services qui
#     en exigent une la REPRENNENT nommément, avec le motif au-dessus ;
#   - `read_only: true` (CIS 5.12) : système de fichiers racine immuable. Les
#     écritures légitimes passent par un volume nommé ou un `tmpfs:` déclaré.
#
# Trois services gardent une racine inscriptible (`*durcissement-inscriptible`)
# et le motif est écrit sur chacun : leur état vit dans la couche du conteneur,
# faute de volume. Un `tmpfs` les ferait démarrer mais changerait la durabilité
# au redémarrage — ce n'est pas un durcissement, c'est un effet de bord (`AM-83`).
#
# La porte `pnpm conteneurs` refuse tout service dont la posture n'est ni cette
# ancre ni une exemption motivée, sur les QUATRE composes.
x-durcissement: &durcissement
  security_opt:
    - 'no-new-privileges:true'
  cap_drop:
    - ALL
  read_only: true

x-durcissement-inscriptible: &durcissement-inscriptible
  security_opt:
    - 'no-new-privileges:true'
  cap_drop:
    - ALL
  read_only: false

services:
  # --- Infrastructure ------------------------------------------------------
  postgres-referentiel:
    <<: *durcissement
    # L'entrypoint postgres démarre root puis bascule sur `postgres` (uid 70) :
    # SETUID/SETGID pour la bascule, CHOWN/FOWNER/DAC_OVERRIDE pour reprendre la
    # propriété et les droits du répertoire de données AU SECOND BOOT (0700 uid 70).
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    tmpfs:
      # Socket Unix et fichier de verrou : les seules écritures hors volume.
      - /var/run/postgresql
      - /tmp
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: referentiel
      POSTGRES_PASSWORD: referentiel
      POSTGRES_DB: referentiel
    volumes:
      - pg-referentiel:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U referentiel -d referentiel']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-foyer:
    <<: *durcissement
    # L'entrypoint postgres démarre root puis bascule sur `postgres` (uid 70) :
    # SETUID/SETGID pour la bascule, CHOWN/FOWNER/DAC_OVERRIDE pour reprendre la
    # propriété et les droits du répertoire de données AU SECOND BOOT (0700 uid 70).
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    tmpfs:
      # Socket Unix et fichier de verrou : les seules écritures hors volume.
      - /var/run/postgresql
      - /tmp
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foyer
      POSTGRES_PASSWORD: foyer
      POSTGRES_DB: foyer
    volumes:
      - pg-foyer:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foyer -d foyer']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-planification:
    <<: *durcissement
    # L'entrypoint postgres démarre root puis bascule sur `postgres` (uid 70) :
    # SETUID/SETGID pour la bascule, CHOWN/FOWNER/DAC_OVERRIDE pour reprendre la
    # propriété et les droits du répertoire de données AU SECOND BOOT (0700 uid 70).
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    tmpfs:
      # Socket Unix et fichier de verrou : les seules écritures hors volume.
      - /var/run/postgresql
      - /tmp
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planification
      POSTGRES_PASSWORD: planification
      POSTGRES_DB: planification
    volumes:
      - pg-planification:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planification -d planification']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-tarification:
    <<: *durcissement
    # L'entrypoint postgres démarre root puis bascule sur `postgres` (uid 70) :
    # SETUID/SETGID pour la bascule, CHOWN/FOWNER/DAC_OVERRIDE pour reprendre la
    # propriété et les droits du répertoire de données AU SECOND BOOT (0700 uid 70).
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    tmpfs:
      # Socket Unix et fichier de verrou : les seules écritures hors volume.
      - /var/run/postgresql
      - /tmp
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tarification
      POSTGRES_PASSWORD: tarification
      POSTGRES_DB: tarification
    volumes:
      - pg-tarification:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tarification -d tarification']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-notifications:
    <<: *durcissement
    # L'entrypoint postgres démarre root puis bascule sur `postgres` (uid 70) :
    # SETUID/SETGID pour la bascule, CHOWN/FOWNER/DAC_OVERRIDE pour reprendre la
    # propriété et les droits du répertoire de données AU SECOND BOOT (0700 uid 70).
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    tmpfs:
      # Socket Unix et fichier de verrou : les seules écritures hors volume.
      - /var/run/postgresql
      - /tmp
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    volumes:
      - pg-notifications:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifications -d notifications']
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    # Racine inscriptible ASSUMÉE : sans `-sd`, JetStream pose son magasin dans
    # `/tmp/nats` (vérifié : `read_only` seul le fait mourir au démarrage sur
    # « could not create storage directory »). Un `tmpfs` sur /tmp ferait
    # démarrer le serveur mais viderait les flux à chaque REDÉMARRAGE, alors
    # qu'ils y survivent aujourd'hui : ce serait changer la durabilité de
    # l'outbox sous couvert de durcissement (`AM-83`).
    <<: *durcissement-inscriptible
    image: nats:2.10-alpine
    command: ['-js', '-m', '8222']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:8222/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Observabilité -------------------------------------------------------
  otel-collector:
    <<: *durcissement
    # P2-8 (doc 18) — épinglé par digest (= v0.153.0) pour une pile reproductible.
    image: otel/opentelemetry-collector-contrib@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - tempo

  tempo:
    <<: *durcissement
    # P2-8 — épinglé par digest (= tempo v3.0.0) pour une pile reproductible.
    image: grafana/tempo@sha256:a5b8cc916da6cd934ac12c0569e2cc743b2886243ead6a41e06437ce8c480a8d
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./docker/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    # Racine inscriptible ASSUMÉE : la base TSDB (`--storage.tsdb.path=/prometheus`)
    # n'a pas de volume nommé, elle vit dans la couche du conteneur. Même
    # arbitrage que `nats` — un tmpfs perdrait l'historique à chaque redémarrage
    # en plus de le perdre à chaque recréation (`AM-83`).
    <<: *durcissement-inscriptible
    # P2-8 — épinglé par digest (= v3.12.0) pour une pile reproductible.
    image: prom/prometheus@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    # Command par défaut de l'image + `--web.enable-remote-write-receiver` (Phase 13a) :
    # Tempo (metrics_generator) POUSSE les métriques RED dérivées des traces via
    # remote_write vers cette cible — l'endpoint /api/v1/write est désactivé par défaut.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Règles d'alerte montées dans un sous-dossier dédié.
      - ./docker/prometheus:/etc/prometheus/alerts:ro
    depends_on:
      - otel-collector
      - nats-exporter
      - alertmanager
      - blackbox-exporter

  # Alertmanager (P2-3, doc 18) — reçoit les alertes « firing » de Prometheus,
  # les groupe/déduplique et (une fois un receiver configuré) les notifie. Rend
  # OPÉRANT le pipeline d'alerte défini dans docker/prometheus/alerts.yml. UI :9093.
  alertmanager:
    # Racine inscriptible ASSUMÉE : silences et journal de notifications
    # (`/alertmanager`) n'ont pas de volume nommé. Un silence posé pendant une
    # astreinte ne survivrait pas à un tmpfs remis à zéro (`AM-83`).
    <<: *durcissement-inscriptible
    # Épinglé par digest (= v0.32.2) pour une pile reproductible (cf. P2-8).
    image: prom/alertmanager@sha256:b85533a2eb45865835315810315f6951331b2dbc8c93a6cf9a51e156a006a706
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  # Exporte les métriques NATS/JetStream au format Prometheus.
  # Scrape l'API monitoring NATS (http://nats:8222) et expose :7777/metrics.
  # Permet les alertes sur consumer lag et la visualisation dans Grafana.
  nats-exporter:
    <<: *durcissement
    # P2-8 — épinglé par digest (= v0.20.1) pour une pile reproductible.
    image: natsio/prometheus-nats-exporter@sha256:4fbf6dacb84780a45a1c3af9b1080c69451a288d20902deae671b80717bb8f61
    command:
      - '-connz'
      - '-varz'
      - '-jsz=all'
      - 'http://nats:8222'
    depends_on:
      nats:
        condition: service_healthy

  # Sonde de disponibilité « boîte noire » (Phase 6). Prometheus le scrape via
  # /probe pour sonder l'endpoint de liveness (/api/health/live) des 5 services
  # applicatifs (api-gateway + svc-*), jusqu'ici NON surveillés par ServiceDown.
  # Voir docker/blackbox.yml (module http_2xx) et le job `blackbox` de
  # docker/prometheus.yml. `probe_success == 0` arme l'alerte AppServiceDown.
  blackbox-exporter:
    <<: *durcissement
    # Épinglé par digest (= v0.27.0) pour une pile reproductible (cf. P2-8).
    image: prom/blackbox-exporter@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
    command: ['--config.file=/etc/blackbox/blackbox.yml']
    volumes:
      - ./docker/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  # Exporters Postgres (Phase 13c) — une instance par base. Chacun se connecte à SON
  # Postgres (least privilege, attribution claire des pannes) et expose les métriques
  # pg_* sur :9187. Prometheus les scrape (job `postgres`, label `base`). Le mot de
  # passe est le défaut du base/dev ; la PROD le surcharge par le secret PG_*_PWD
  # (docker-compose.server.yml), comme pour DATABASE_URL des services.
  postgres-exporter-referentiel:
    <<: *durcissement
    # Épinglé par digest (= v0.17.1) pour une pile reproductible (cf. P2-8).
    image: quay.io/prometheuscommunity/postgres-exporter@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    environment:
      DATA_SOURCE_NAME: postgresql://referentiel:referentiel@postgres-referentiel:5432/referentiel?sslmode=disable
    depends_on:
      postgres-referentiel:
        condition: service_healthy

  postgres-exporter-foyer:
    <<: *durcissement
    image: quay.io/prometheuscommunity/postgres-exporter@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    environment:
      DATA_SOURCE_NAME: postgresql://foyer:foyer@postgres-foyer:5432/foyer?sslmode=disable
    depends_on:
      postgres-foyer:
        condition: service_healthy

  postgres-exporter-planification:
    <<: *durcissement
    image: quay.io/prometheuscommunity/postgres-exporter@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    environment:
      DATA_SOURCE_NAME: postgresql://planification:planification@postgres-planification:5432/planification?sslmode=disable
    depends_on:
      postgres-planification:
        condition: service_healthy

  postgres-exporter-tarification:
    <<: *durcissement
    image: quay.io/prometheuscommunity/postgres-exporter@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    environment:
      DATA_SOURCE_NAME: postgresql://tarification:tarification@postgres-tarification:5432/tarification?sslmode=disable
    depends_on:
      postgres-tarification:
        condition: service_healthy

  postgres-exporter-notifications:
    <<: *durcissement
    image: quay.io/prometheuscommunity/postgres-exporter@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    environment:
      DATA_SOURCE_NAME: postgresql://notifications:notifications@postgres-notifications:5432/notifications?sslmode=disable
    depends_on:
      postgres-notifications:
        condition: service_healthy

  grafana:
    <<: *durcissement
    tmpfs:
      # Grafana télécharge et déballe ses plugins DANS /tmp avant de les poser
      # sur /var/lib/grafana/plugins (volume). Sans ce tmpfs le conteneur reste
      # `healthy` mais journalise « failed to create temporary file: open
      # /tmp/….zip: read-only file system » : trois plugins par défaut ne sont
      # jamais installés, et l'initialisation du backend elasticsearch échoue.
      - /tmp
    # P2-8 — épinglé par digest (= v13.0.2) pour une pile reproductible.
    image: grafana/grafana@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboards JSON provisionnés automatiquement au démarrage.
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus

  # Agrégation des logs (Phase 13b). Loki stocke les logs poussés par Promtail ;
  # Grafana l'interroge (datasource `loki`) et corrèle Tempo→Loki via `trace_id`.
  # NB : aucun port hôte publié en base/prod (Grafana l'atteint via loki:3100 sur le
  # réseau Docker) → pas de conflit avec le port 3100 déjà pris sur le serveur. Le
  # port local est publié par docker-compose.override.yml (dev uniquement).
  loki:
    <<: *durcissement
    # Épinglé par digest (= v3.4.2) pour une pile reproductible (cf. P2-8).
    image: grafana/loki@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
    command: ['-config.file=/etc/loki/loki-config.yaml']
    volumes:
      - ./docker/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      # L'image n'embarque pas de healthcheck ; busybox wget est dispo dans /busybox.
      test: ['CMD', '/busybox/wget', '-qO-', 'http://127.0.0.1:3100/ready']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Collecte les logs Docker des 5 services applicatifs et les pousse vers Loki
  # (Phase 13b). Découverte via le socket Docker (monté en lecture seule).
  promtail:
    <<: *durcissement
    tmpfs:
      # positions.yaml (docker/promtail-config.yaml) — reprise de lecture des logs.
      - /tmp
    # Épinglé par digest (= v3.4.2) pour une pile reproductible (cf. P2-8).
    image: grafana/promtail@sha256:c6e9a987ca086cbfef945b8ebd708eb09f98b5e78bfb659e4e5a8b3bd604d11b
    command: ['-config.file=/etc/promtail/promtail-config.yaml']
    volumes:
      - ./docker/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Socket Docker en lecture seule → découverte + lecture des logs des conteneurs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # --- Services métier -----------------------------------------------------
  svc-referentiel:
    <<: *durcissement
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: svc-referentiel
    environment:
      PORT: '3001'
      DATABASE_URL: postgres://referentiel:referentiel@postgres-referentiel:5432/referentiel
      NATS_URL: nats://nats:4222
      OTEL_SERVICE_NAME: svc-referentiel
      # Assertion d'identité inter-services (fondations lot 3) : le chemin
      # signature/vérification est réellement exercé en dev/e2e-stack (observe).
      ASSERTION_IDENTITE_SECRET: dev-assertion-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    # Liveness HTTP (lot A6) — même patron que la gateway (AUD-01) : /api/health/live
    # sans dépendance externe, sondé par `node` (ni curl ni wget dans node:24-slim).
    # `up --wait` (e2e-stack CI, deploy.mjs) attend donc des services qui SERVENT,
    # pas seulement des process lancés. Reproduit sur les 5 svc-* (port de chacun).
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3001/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      postgres-referentiel:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started

  svc-foyer:
    <<: *durcissement
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: svc-foyer
    environment:
      PORT: '3002'
      DATABASE_URL: postgres://foyer:foyer@postgres-foyer:5432/foyer
      NATS_URL: nats://nats:4222
      OTEL_SERVICE_NAME: svc-foyer
      # Assertion d'identité inter-services (fondations lot 3) : le chemin
      # signature/vérification est réellement exercé en dev/e2e-stack (observe).
      ASSERTION_IDENTITE_SECRET: dev-assertion-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # L'image embarque NODE_ENV=production (Dockerfile) → le garde-fou de boot de
      # svc-foyer (L5) exige un DESABONNEMENT_TOKEN_SECRET non-dev et non vide. Valeur
      # FACTICE pour la pile locale/CI (jamais un vrai secret ; la prod l'écrase via
      # docker-compose.server.yml `${DESABONNEMENT_TOKEN_SECRET:?}`).
      DESABONNEMENT_TOKEN_SECRET: factice
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3002/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      postgres-foyer:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started

  svc-planification:
    <<: *durcissement
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: svc-planification
    environment:
      PORT: '3004'
      DATABASE_URL: postgres://planification:planification@postgres-planification:5432/planification
      NATS_URL: nats://nats:4222
      REFERENTIEL_URL: http://svc-referentiel:3001
      OTEL_SERVICE_NAME: svc-planification
      # Assertion d'identité inter-services (fondations lot 3) : le chemin
      # signature/vérification est réellement exercé en dev/e2e-stack (observe).
      ASSERTION_IDENTITE_SECRET: dev-assertion-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3004/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      postgres-planification:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started

  svc-tarification:
    <<: *durcissement
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: svc-tarification
    environment:
      PORT: '3005'
      DATABASE_URL: postgres://tarification:tarification@postgres-tarification:5432/tarification
      NATS_URL: nats://nats:4222
      REFERENTIEL_URL: http://svc-referentiel:3001
      FOYER_URL: http://svc-foyer:3002
      PLANIFICATION_URL: http://svc-planification:3004
      OTEL_SERVICE_NAME: svc-tarification
      # Assertion d'identité inter-services (fondations lot 3) : le chemin
      # signature/vérification est réellement exercé en dev/e2e-stack (observe).
      ASSERTION_IDENTITE_SECRET: dev-assertion-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3005/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      postgres-tarification:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started

  svc-notifications:
    <<: *durcissement
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: svc-notifications
    environment:
      PORT: '3006'
      DATABASE_URL: postgres://notifications:notifications@postgres-notifications:5432/notifications
      NATS_URL: nats://nats:4222
      # Relecture du planning pour le diff de validation hebdomadaire (Lot 4).
      PLANIFICATION_URL: http://svc-planification:3004
      # Frappe des jetons de désabonnement one-click (RFC 8058, PR5) : svc-notifications
      # appelle svc-foyer (agrégat propriétaire du jeton) via DesabonnementClient. URL
      # interne, identique en prod/staging → dans le compose de base (pas dans l'override).
      FOYER_URL: http://svc-foyer:3002
      # L'image embarque NODE_ENV=production (Dockerfile) → le garde-fou de boot (Lot 7)
      # exige que les URL de base des liens d'e-mail soient publiques (https + domaine,
      # ni IP ni localhost). Valeurs SENTINELLES `.invalid` (RFC 2606) pour la pile
      # locale/CI/staging : l'envoi e-mail est en dry-run, aucun lien n'est ouvert ; la
      # prod les écrase via docker-compose.server.yml (`${SERVER_ORIGIN:?}` = domaine public).
      NOTIF_APP_URL: https://web.e2e.invalid
      NOTIF_PUBLIC_API_URL: https://api.e2e.invalid
      OTEL_SERVICE_NAME: svc-notifications
      # Assertion d'identité inter-services (fondations lot 3) : le chemin
      # signature/vérification est réellement exercé en dev/e2e-stack (observe).
      ASSERTION_IDENTITE_SECRET: dev-assertion-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3006/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      postgres-notifications:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started

  api-gateway:
    <<: *durcissement
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: api-gateway
    environment:
      PORT: '3000'
      REFERENTIEL_URL: http://svc-referentiel:3001
      FOYER_URL: http://svc-foyer:3002
      PLANIFICATION_URL: http://svc-planification:3004
      TARIFICATION_URL: http://svc-tarification:3005
      NOTIFICATIONS_URL: http://svc-notifications:3006
      # Auth désactivée par défaut dans la pile locale (pas de GATEWAY_TOKEN) ;
      # CORS reflète toutes les origines tant que CORS_ORIGINS n'est pas défini.
      # L'image embarque NODE_ENV=production (Dockerfile) : le garde-fou AQ-01
      # (doc 27) exige donc l'échappatoire EXPLICITE pour démarrer sans jeton,
      # y compris dans la pile locale/CI. La retirer si un jeton est fourni.
      GATEWAY_AUTH_DISABLED: '1'
      # Rate-limit relevé pour la pile locale/E2E : toute la suite tape depuis la
      # même IP (proxy nginx) en quelques dizaines de secondes et saturerait la
      # valeur de prod (120/min). N'affecte PAS la prod (déployée hors compose).
      RATE_LIMIT_MAX: '100000'
      # Relais de confiance entre la gateway et le client (`trust proxy`). Pile
      # locale : navigateur → `web` (nginx, qui pose `X-Forwarded-For`) → gateway,
      # soit UN saut. Sans ce réglage, `req.ip` valait l'adresse de nginx pour tout
      # le trafic et le rate-limit était une fenêtre unique partagée (AN-15).
      RATE_LIMIT_PROXY_HOPS: '1'
      OTEL_SERVICE_NAME: api-gateway
      # Assertion d'identité inter-services (fondations lot 3) : le chemin
      # signature/vérification est réellement exercé en dev/e2e-stack (observe).
      ASSERTION_IDENTITE_SECRET: dev-assertion-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      # Liveness HTTP (endpoint /api/health/live, SANS dépendance externe) :
      # garantit que le serveur gateway SERT réellement avant que `up --wait` (et
      # `web`) ne le considèrent prêt — corrige la course « curl (52) Empty reply »
      # du smoke (AUD-01, doc 25). `node` est le runtime de l'image node:24-slim
      # (fetch global ≥ Node 18 ; ni curl ni wget présents dans l'image).
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3000/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      svc-referentiel:
        condition: service_started
      svc-foyer:
        condition: service_started
      svc-planification:
        condition: service_started
      svc-tarification:
        condition: service_started
      svc-notifications:
        condition: service_started
      otel-collector:
        condition: service_started

  # --- Front web (Phase 8) -------------------------------------------------
  web:
    <<: *durcissement
    tmpfs:
      # nginx-unprivileged écrit pid et fichiers temporaires dans /tmp.
      - /tmp
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # nginx sert la SPA et proxifie /api vers api-gateway (même origine, pas de CORS).
    # Base URL par défaut '/api' → aucune variable VITE_ à injecter au build.
    depends_on:
      api-gateway:
        # Attendre que la gateway soit réellement prête (healthcheck liveness)
        # et pas seulement démarrée, pour ne pas proxifier vers un serveur muet.
        condition: service_healthy

volumes:
  pg-referentiel:
  pg-foyer:
  pg-planification:
  pg-tarification:
  pg-notifications:
  tempo-data:
  grafana-data:
  loki-data:
