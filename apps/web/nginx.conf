server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En-têtes sécurité (lot A6) — posés ICI (unique endroit qui sert le HTML) :
  # ils suivent la réponse à travers Caddy (LAN) comme Cloudflare (public), et
  # s'appliquent aussi aux réponses proxifiées /api (aucune `location` ne
  # redéfinit add_header, donc l'héritage server→location joue). `always` = y
  # compris sur les erreurs (4xx/5xx).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP : tout est même-origine (bundle Vite hashé, SW workbox, manifest PWA,
  # /api relatif — aucun CDN, aucune police externe). `style-src 'unsafe-inline'`
  # reste requis par les styles inline React (~300, résorption = lot C4) ;
  # les scripts, eux, sont stricts ('self', pas d'inline dans l'index Vite).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Le front appelle /api/v1/... (chemin relatif) ; nginx relaie vers la gateway
  # sur le réseau interne docker. Pas de CORS (même origine).
  location /api/ {
    proxy_pass http://api-gateway:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fallback SPA : toute autre route sert index.html (routeur côté client).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
